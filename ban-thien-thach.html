<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bắn Thiên Thạch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 900px;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 15, 25, 0.85);
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }

        h1 {
            font-size: 2.5rem;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7), 0 0 20px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
            text-align: center;
        }

        p {
            font-size: 1.1rem;
            color: #a0aec0;
            margin-bottom: 30px;
            text-align: center;
            padding: 0 20px;
        }

        .btn {
            background: linear-gradient(135deg, #00ffff 0%, #0080ff 100%);
            color: #0b0f19;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.4);
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .hud-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #stats-gameover {
            font-size: 1.3rem;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.6;
        }

        .highlight {
            color: #00ffff;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD trong game -->
        <div id="hud" class="hidden">
            <div class="hud-item">Điểm: <span id="score-val">0</span></div>
            <div class="hud-item">Cấp đạn: <span id="level-val">1</span></div>
        </div>

        <!-- Màn hình Bắt đầu -->
        <div id="start-screen" class="ui-screen">
            <h1>BẮN THIÊN THẠCH</h1>
            <p>Vuốt màn hình để di chuyển phi thuyền.<br>Hạ thiên thạch để nhận nâng cấp và ghi điểm cao!</p>
            <button class="btn" id="start-btn">CHƠI NGAY</button>
        </div>

        <!-- Màn hình Game Over -->
        <div id="gameover-screen" class="ui-screen hidden">
            <h1>THẤT BẠI</h1>
            <div id="stats-gameover">
                Điểm đạt được: <span id="final-score" class="highlight">0</span><br>
                Điểm cao nhất: <span id="final-highscore" class="highlight">0</span>
            </div>
            <button class="btn" id="restart-btn">CHƠI LẠI</button>
        </div>

        <!-- Canvas Game -->
        <canvas id="gameCanvas"></canvas>
    </div>

<script>
    // --- Web Audio API Quản lý Âm thanh ---
    const AudioSystem = {
        ctx: null,
        init() {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        },
        playShoot() {
            if (!this.ctx) return;
            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.1);
        },
        playExplosion(isBig = false) {
            if (!this.ctx) return;
            let bufferSize = this.ctx.sampleRate * (isBig ? 0.4 : 0.2);
            let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            let data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            let noise = this.ctx.createBufferSource();
            noise.buffer = buffer;
            let filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(isBig ? 400 : 800, this.ctx.currentTime);
            filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + (isBig ? 0.4 : 0.2));
            let gain = this.ctx.createGain();
            gain.gain.setValueAtTime(isBig ? 0.4 : 0.2, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + (isBig ? 0.4 : 0.2));
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start();
        },
        playPowerup() {
            if (!this.ctx) return;
            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        },
        playClick() {
            if (!this.ctx) return;
            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.05);
        }
    };

    // --- Cấu hình Game ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let screenWidth, screenHeight;
    function resize() {
        screenWidth = canvas.width = canvas.parentElement.clientWidth;
        screenHeight = canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Biến trạng thái
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let highScore = localStorage.getItem('space_highscore') || 0;
    let weaponLevel = 1;
    let scoreToUpgrade = 20;

    // Các đối tượng game
    let player;
    let bullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];
    let stars = [];

    // Tạo nền sao
    for (let i = 0; i < 60; i++) {
        stars.push({
            x: Math.random() * screenWidth,
            y: Math.random() * screenHeight,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 2 + 1
        });
    }

    // --- Định nghĩa Lớp (Classes) ---
    class Player {
        constructor() {
            this.width = 45;
            this.height = 45;
            this.x = screenWidth / 2;
            this.y = screenHeight - 100;
            this.targetX = this.x;
            this.targetY = this.y;
            this.shootTimer = 0;
            this.shootInterval = 12; // Số frame mỗi lần bắn
        }

        update() {
            // Mượt mà di chuyển theo tay vuốt
            this.x += (this.targetX - this.x) * 0.2;
            this.y += (this.targetY - this.y) * 0.2;

            // Giới hạn trong màn hình
            this.x = Math.max(this.width/2, Math.min(screenWidth - this.width/2, this.x));
            this.y = Math.max(this.height/2, Math.min(screenHeight - this.height/2, this.y));

            // Tự động bắn
            this.shootTimer++;
            if (this.shootTimer >= this.shootInterval) {
                this.shoot();
                this.shootTimer = 0;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);

            // Thân phi thuyền
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(0, -this.height / 2);
            ctx.lineTo(this.width / 2, this.height / 2);
            ctx.lineTo(0, this.height / 3);
            ctx.lineTo(-this.width / 2, this.height / 2);
            ctx.closePath();
            ctx.fill();

            // Động cơ phản lực
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.moveTo(-this.width / 4, this.height / 2);
            ctx.lineTo(0, this.height / 2 + 12 + Math.random() * 8);
            ctx.lineTo(this.width / 4, this.height / 2);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        shoot() {
            AudioSystem.playShoot();
            if (weaponLevel === 1) {
                bullets.push(new Bullet(this.x, this.y - this.height / 2, 0, -12));
            } else if (weaponLevel === 2) {
                bullets.push(new Bullet(this.x - 10, this.y - this.height / 2, 0, -12));
                bullets.push(new Bullet(this.x + 10, this.y - this.height / 2, 0, -12));
            } else {
                bullets.push(new Bullet(this.x, this.y - this.height / 2, 0, -14));
                bullets.push(new Bullet(this.x - 15, this.y - this.height / 4, -1, -12));
                bullets.push(new Bullet(this.x + 15, this.y - this.height / 4, 1, -12));
            }
        }
    }

    class Bullet {
        constructor(x, y, vx, vy) {
            this.x = x;
            this.y = y;
            this.vx = vx;
            this.vy = vy;
            this.width = 4;
            this.height = 12;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
        }

        draw() {
            ctx.fillStyle = '#ff00ff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ff00ff';
            ctx.fillRect(this.x - this.width/2, this.y, this.width, this.height);
            ctx.shadowBlur = 0; // Reset
        }
    }

    class Enemy {
        constructor() {
            this.radius = Math.random() * 20 + 15; // 15 đến 35
            this.x = Math.random() * (screenWidth - this.radius * 2) + this.radius;
            this.y = -this.radius;
            this.vy = Math.random() * 2 + (score > 100 ? 3 : 1.5);
            this.vx = (Math.random() - 0.5) * 2;
            this.maxHp = Math.floor(this.radius / 12) + Math.floor(score / 150);
            this.hp = this.maxHp;
            this.rotation = 0;
            this.rotSpeed = (Math.random() - 0.5) * 0.05;
        }

        update() {
            this.y += this.vy;
            this.x += this.vx;
            this.rotation += this.rotSpeed;

            // Nảy tường nhẹ
            if (this.x < this.radius || this.x > screenWidth - this.radius) {
                this.vx *= -1;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            ctx.strokeStyle = '#a0aec0';
            ctx.fillStyle = '#4a5568';
            ctx.lineWidth = 2;

            ctx.beginPath();
            let points = 7;
            for (let i = 0; i < points; i++) {
                let angle = (i / points) * Math.PI * 2;
                let r = this.radius * (0.8 + Math.sin(i * 3) * 0.2);
                let px = Math.cos(angle) * r;
                let py = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.color = color;
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * 4 + 1;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.alpha = 1;
            this.decay = Math.random() * 0.03 + 0.02;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.alpha -= this.decay;
        }

        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha);
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, 3, 3);
            ctx.restore();
        }
    }

    class PowerUp {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.radius = 12;
            this.vy = 2;
        }
        update() {
            this.y += this.vy;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.fillStyle = '#00ff00';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ff00';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('+', 0, 0);
            ctx.restore();
        }
    }

    // --- Điều khiển Cảm ứng & Chuột ---
    let isDragging = false;

    function handleTouchStart(e) {
        if (gameState !== 'PLAYING') return;
        isDragging = true;
        updateTouchPos(e);
    }

    function handleTouchMove(e) {
        if (!isDragging || gameState !== 'PLAYING') return;
        updateTouchPos(e);
    }

    function handleTouchEnd() {
        isDragging = false;
    }

    function updateTouchPos(e) {
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        let rect = canvas.getBoundingClientRect();
        player.targetX = clientX - rect.left;
        player.targetY = clientY - rect.top;
    }

    window.addEventListener('mousedown', handleTouchStart);
    window.addEventListener('mousemove', handleTouchMove);
    window.addEventListener('mouseup', handleTouchEnd);

    window.addEventListener('touchstart', handleTouchStart, {passive: false});
    window.addEventListener('touchmove', handleTouchMove, {passive: false});
    window.addEventListener('touchend', handleTouchEnd);

    // --- Logic Vòng lặp Game ---
    let enemySpawnTimer = 0;
    let enemySpawnInterval = 60;

    function resetGame() {
        score = 0;
        weaponLevel = 1;
        scoreToUpgrade = 20;
        bullets = [];
        enemies = [];
        particles = [];
        powerups = [];
        player = new Player();
        enemySpawnTimer = 0;
        document.getElementById('score-val').innerText = score;
        document.getElementById('level-val').innerText = weaponLevel;
    }

    function spawnExplosion(x, y, color = '#ffaa00', count = 15) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color));
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        // Cập nhật sao nền
        stars.forEach(s => {
            s.y += s.speed;
            if (s.y > screenHeight) s.y = 0;
        });

        player.update();

        // Spawn Thiên thạch
        enemySpawnTimer++;
        let currentInterval = Math.max(20, enemySpawnInterval - Math.floor(score / 50) * 5);
        if (enemySpawnTimer >= currentInterval) {
            enemies.push(new Enemy());
            enemySpawnTimer = 0;
        }

        // Cập nhật Đạn
        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].update();
            if (bullets[i].y < -10) {
                bullets.splice(i, 1);
            }
        }

        // Cập nhật PowerUp
        for (let i = powerups.length - 1; i >= 0; i--) {
            powerups[i].update();
            // Va chạm với player
            let dist = Math.hypot(powerups[i].x - player.x, powerups[i].y - player.y);
            if (dist < powerups[i].radius + player.width/2) {
                AudioSystem.playPowerup();
                if (weaponLevel < 3) weaponLevel++;
                document.getElementById('level-val').innerText = weaponLevel;
                powerups.splice(i, 1);
                continue;
            }
            if (powerups[i].y > screenHeight + 20) {
                powerups.splice(i, 1);
            }
        }

        // Cập nhật Thiên thạch & Xử lý Va chạm
        for (let i = enemies.length - 1; i >= 0; i--) {
            let en = enemies[i];
            en.update();

            // Va chạm thiên thạch với phi thuyền (Game Over)
            let distToPlayer = Math.hypot(en.x - player.x, en.y - player.y);
            if (distToPlayer < en.radius + player.width/3) {
                AudioSystem.playExplosion(true);
                spawnExplosion(player.x, player.y, '#00ffff', 30);
                triggerGameOver();
                return;
            }

            // Va chạm đạn với thiên thạch
            let hit = false;
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                let distToBullet = Math.hypot(en.x - b.x, en.y - b.y);
                if (distToBullet < en.radius) {
                    hit = true;
                    bullets.splice(j, 1);
                    break;
                }
            }

            if (hit) {
                en.hp--;
                spawnExplosion(en.x, en.y, '#a0aec0', 5);
                if (en.hp <= 0) {
                    AudioSystem.playExplosion(false);
                    spawnExplosion(en.x, en.y, '#ffaa00', 20);
                    
                    // Cộng điểm
                    score += Math.floor(en.radius);
                    document.getElementById('score-val').innerText = score;

                    // Kiểm tra rơi vật phẩm nâng cấp
                    if (Math.random() < 0.25) {
                        powerups.push(new PowerUp(en.x, en.y));
                    }

                    enemies.splice(i, 1);
                    continue;
                }
            }

            // Xóa thiên thạch khi ra khỏi màn hình
            if (en.y > screenHeight + en.radius) {
                enemies.splice(i, 1);
            }
        }

        // Cập nhật Hiệu ứng hạt
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            if (particles[i].alpha <= 0) {
                particles.splice(i, 1);
            }
        }
    }

    function draw() {
        ctx.clearRect(0, 0, screenWidth, screenHeight);

        // Vẽ sao nền
        ctx.fillStyle = '#ffffff';
        stars.forEach(s => {
            ctx.globalAlpha = s.speed / 3;
            ctx.fillRect(s.x, s.y, s.size, s.size);
        });
        ctx.globalAlpha = 1;

        // Vẽ các đối tượng
        powerups.forEach(p => p.draw());
        bullets.forEach(b => b.draw());
        enemies.forEach(e => e.draw());
        particles.forEach(p => p.draw());
        
        if (gameState === 'PLAYING') {
            player.draw();
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    function triggerGameOver() {
        gameState = 'GAMEOVER';
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('gameover-screen').classList.remove('hidden');
        
        document.getElementById('final-score').innerText = score;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('space_highscore', highScore);
        }
        document.getElementById('final-highscore').innerText = highScore;
    }

    // --- Gắn sự kiện giao diện UI ---
    document.getElementById('start-btn').addEventListener('click', () => {
        AudioSystem.init();
        AudioSystem.playClick();
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        resetGame();
        gameState = 'PLAYING';
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
        AudioSystem.playClick();
        document.getElementById('gameover-screen').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        resetGame();
        gameState = 'PLAYING';
    });

    // Khởi chạy vòng lặp
    loop();

</script>
</body>
</html>
